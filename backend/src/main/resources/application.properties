# Server
server.port=8080
spring.application.name=contact-management-system

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/contacts?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.jdbc.batch_size=20

# JWT
app.jwt.secret=${JWT_SECRET:Y2hhbmdlLXRoaXMtbG9uZy1zZWNyZXQta2V5LWZvci1qd3QtaGFzaC1zaWduaW5nLWFsZ29yaXRobQ==}
app.jwt.expiration-ms=86400000
app.jwt.issuer=contact-management-system

# Logging
logging.level.root=INFO
logging.level.com.example.contactmanager=DEBUG
logging.file.name=logs/contact-management.log

# CORS (frontend dev server)
app.cors.allowed-origins=http://localhost:5173
