# Server
server.port=8080
spring.application.name=contact-management-system

# .env contains DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET
spring.config.import=optional:file:.env[.properties]

# PostgreSQL datasource values come from .env (loaded above) or environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20

# JWT value comes from .env or environment variable
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.issuer=contact-management-system

# Logging
logging.level.root=INFO
logging.level.com.example.contactmanager=DEBUG
logging.file.name=logs/contact-management.log

# CORS (frontend dev server)
app.cors.allowed-origins=http://localhost:5173
