# Test-only configuration. Uses H2 in PostgreSQL compatibility mode so that
# the same JPA mappings work without a real PostgreSQL instance.
spring.datasource.url=jdbc:h2:mem:contact_db_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=Y2hhbmdlLXRoaXMtbG9uZy1zZWNyZXQta2V5LWZvci1qd3QtaGFzaC1zaWduaW5nLWFsZ29yaXRobQ==
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.jwt.issuer=contact-management-system
app.cors.allowed-origins=http://localhost:5173
